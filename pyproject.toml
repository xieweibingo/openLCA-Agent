[project]
name = "openlca-agent"
version = "0.1.0"
description = "MCP server and workflow helpers for AI-driven openLCA automation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.23.0",
    "olca-ipc>=2.4.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "pydantic>=2.12.0",
    "rapidfuzz>=3.14.0",
    "typer>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
openlca-agent = "openlca_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openlca_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running openLCA desktop IPC server and an opened database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "database", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
